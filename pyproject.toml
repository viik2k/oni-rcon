[project]
name = "oni-rcon"
dynamic = ["version"]
description = "An ONI-themed terminal admin console for community Halo dedicated servers over RCON: Project Reclaimer (Halo 3), and other projects that speak its remote console."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Arche Labs (viik)" }]
requires-python = ">=3.11"
dependencies = ["textual>=8.0", "websockets>=15"]
keywords = ["halo", "reclaimer", "gravemind", "rcon", "tui", "textual", "server-admin"]
classifiers = ["Environment :: Console", "Programming Language :: Python :: 3", "Topic :: Games/Entertainment"]

[project.scripts]
oni-rcon = "oni_rcon.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/oni_rcon/__init__.py"
