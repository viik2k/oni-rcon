name: desktop
on:
  push:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
    tags: ["desktop-v*"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:
defaults:
  run:
    working-directory: desktop
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run build  # typechecks, and the backend embeds what it builds
      - run: cargo test --locked
        working-directory: desktop/src-tauri
  bundle:
    # installers for each platform, on a desktop-v* tag or by hand
    if: startsWith(github.ref, 'refs/tags/desktop-v') || github.event_name == 'workflow_dispatch'
    needs: test
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash  # the tag names the version the app reports, or the release would announce itself as an update
        run: |
          v="${GITHUB_REF_NAME#desktop-v}"
          test "$(node -p "require('./package.json').version")" = "$v"
          grep -q "\"version\": \"$v\"" src-tauri/tauri.conf.json
          grep -q "^version = \"$v\"" src-tauri/Cargo.toml
      - run: npm ci
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: oni-rcon-desktop-${{ matrix.os }}
          path: |
            desktop/src-tauri/target/release/bundle/**/*.deb
            desktop/src-tauri/target/release/bundle/**/*.AppImage
            desktop/src-tauri/target/release/bundle/**/*.rpm
            desktop/src-tauri/target/release/bundle/**/*.msi
            desktop/src-tauri/target/release/bundle/**/*-setup.exe
            desktop/src-tauri/target/release/bundle/**/*.dmg
  release:
    # a release of its own, never marked latest: the README's /releases/latest links stay on the terminal console
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: find dist -type f -print0 | xargs -0 gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "ONI RCON desktop ${GITHUB_REF_NAME#desktop-v}" --generate-notes --latest=false
        env:
          GH_TOKEN: ${{ github.token }}
