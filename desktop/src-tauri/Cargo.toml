[package]
name = "oni-rcon"
version = "1.0.1"
description = "An ONI-themed admin console for Project Reclaimer Halo 3 dedicated servers, over RCON."
authors = ["Arche Labs"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "oni_rcon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
toml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
sha2 = "0.10"
hex = "0.4"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
url = "2"
axum = "0.8"
parking_lot = "0.12"
once_cell = "1"
tempfile = "3"
whoami = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
panic = "abort"
